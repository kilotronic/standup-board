name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read

jobs:
  # Refuse the organisation's private terms (the DATA_LEAK_DENYLIST secret) in this event's commits:
  # added lines, file paths, commit messages and authors.
  data-leak-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: kilotronic/checks/data-leak-check@1bc3a9cd7c8875e77799faae6774f6f8eec50207 # v1.0.1
        with:
          denylist: ${{ secrets.DATA_LEAK_DENYLIST }}

  # Secrets in this event's commits: gitleaks (anything shaped like a secret) and trufflehog (keys that still
  # work), from kilotronic/checks/secret-scan.
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: kilotronic/checks/secret-scan@1bc3a9cd7c8875e77799faae6774f6f8eec50207 # v1.0.1

  # Shell scripts (shellcheck), workflows (actionlint), and actions and base images pinned by commit and
  # digest, from kilotronic/checks/lint.
  kilotronic-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: kilotronic/checks/lint@1bc3a9cd7c8875e77799faae6774f6f8eec50207 # v1.0.1
        # Root in the image on purpose: Railway mounts the SQLite volume root-owned (see .pre-commit-config.yaml).
        with:
          skip: non-root

  # Real authors on this event's commits, in the owner's domains, from kilotronic/checks/git-identity.
  git-identity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: kilotronic/checks/git-identity@1bc3a9cd7c8875e77799faae6774f6f8eec50207 # v1.0.1
        with:
          domains: ixid.net, kilotronic.com
          commit-subject: true

  # ── Tests across supported Python versions ────────────────────────────
  # Matrix over the declared support range (requires-python = ">=3.13"). The
  # coverage gate (--cov-fail-under) lives in pyproject.toml, so a bare
  # `pytest` enforces it. fail-fast: false so one version's failure still lets
  # the other report.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: uv sync --frozen
      - name: Run tests
        run: uv run pytest

  # ── Container build + push (GHCR) ─────────────────────────────────────
  # Only on merges to main (push) — PRs skip it, so images are published from
  # the integrated branch, not per-PR. Gated behind prek + test so a red gate
  # never ships an image. Builds the repo Dockerfile.
  container:
    needs: [prek, test]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      # QEMU + Buildx enable the multi-platform build below: the arm64 layer is
      # built under emulation on the amd64 runner. Without them, consumers on
      # arm64 hosts (Apple Silicon) run the amd64 image under slow emulation.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - name: Log in to Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Build and push Docker image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # The format and lint bundle from .pre-commit-config.yaml (formatters, ruff, markdownlint, yamllint, ...),
  # the same hooks a commit runs. The identity, secret and private-term hooks run as their own jobs.
  prek:
    name: Format and lint (prek)
    runs-on: ubuntu-latest
    env:
      SKIP: git-identity,commit-subject,session-trailer,secret-scan,secret-scan-push,data-leak-check,data-leak-check-commit-msg,data-leak-check-pre-push
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - run: pipx run prek==0.5.11 run --all-files --show-diff-on-failure

  # ── Gate job (the single required status check) ───────────────────────
  # Aggregates every job's result. Passes only if each dependency succeeded or
  # was skipped (the container job skips on draft PRs). Branch protection
  # requires THIS job.
  ci:
    if: always()
    needs:
      [
        test,
        container,
        secret-scan,
        kilotronic-lint,
        git-identity,
        data-leak-check,
        prek,
      ]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Every job in needs: is checked, so a new job only has to be added there. A skipped job counts as
      # passing: the container job skips on draft pull requests.
      - name: Check results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for r in $RESULTS; do
            [[ "$r" = success || "$r" = skipped ]] || exit 1
          done
